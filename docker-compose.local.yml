# ===========================================
# LOCAL ENVIRONMENT DOCKER COMPOSE
# ===========================================
# Usage: docker-compose -f docker-compose.local.yml up -d

services:
  postgres:
    image: postgres:17.9-alpine
    container_name: notification-postgres
    env_file:
      - .env.local
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notification_svc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification-rabbitmq
    env_file:
      - .env.local
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
      - "1883:1883"    # MQTT port
      - "8883:8883"    # MQTT/SSL port
      - "15675:15675"  # MQTT over WebSockets
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_mqtt rabbitmq_web_mqtt &&
               rabbitmq-server"

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    env_file:
      - .env.local
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: notification-redis-insight
    env_file:
      - .env.local
    ports:
      - "8001:8001"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: notification-redis-commander
    env_file:
      - .env.local
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    env_file:
      - .env.local
    ports:
      - "${PORT:-8000}:8000"
    command: >
      sh -c "
      echo 'Waiting for Postgres to become fully available...';
      until pg_isready -h postgres -p 5432 -U $$POSTGRES_USER; do 
        echo 'Postgres is unavailable - waiting 3 seconds...'; 
        sleep 3; 
      done; 
      echo 'Postgres is ready. Running migrations...';
      poetry run alembic upgrade head;
      echo 'Migrations applied. Starting application...';
      poetry run uvicorn notification_service.main:main --factory --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

volumes:
  redisinsight-data:
  postgres-data:

networks:
  notification-network:
    driver: bridge
