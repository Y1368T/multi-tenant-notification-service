services:
  postgres:
    image: postgres:15.4-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qena_notification_service_db
    ports:
      - "5433:5432" # External access stays 5433
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qena_notification_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_mqtt rabbitmq_web_mqtt &&
              rabbitmq-server"

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-tenant-notification-service
    ports:
      - "8000:8000"
    # This loads all variables from your .env file automatically
    env_file:
      - .env
    environment:
      # We override the .env URLs here because the .env uses an external IP/Port 
      # but inside Docker we MUST use the service names and port 5432.
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/qena_notification_service_db
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres:5432/qena_notification_service_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://:@redis:6379/0
    command: >
      sh -c "
      echo 'Waiting for Postgres...';
      until pg_isready -h postgres -p 5432 -U postgres; do
        sleep 2;
      done;
      echo 'Running migrations...';
      poetry run alembic upgrade head;
      echo 'Starting app...';
      poetry run uvicorn notification_service.main:main --factory --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

volumes:
  redisinsight-data:
  postgres-data:

networks:
  notification-network:
    driver: bridge