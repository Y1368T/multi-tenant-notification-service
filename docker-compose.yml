services:
  postgres:
    image: postgres:15.4-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qena_notification_service_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification-rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
      - "1883:1883"    # MQTT port
      - "8883:8883"    # MQTT/SSL port
      - "15675:15675"  # MQTT over WebSockets
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_mqtt rabbitmq_web_mqtt &&
               rabbitmq-server"

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: notification-redis-insight
    ports:
      - "8001:8001"
    volumes:
      - redisinsight-data:/data
    environment:
      - RITRUSTEDORIGINS=http://localhost:8001,http://127.0.0.1:8001
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: notification-redis-commander
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

  web:
    image: registry.kifiya.et/qena_baas/multi-tenant-notification-service:development
    container_name: multi-tenant-notification-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-db:5433/qena_notification_service_db
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres-db:5433/qena_notification_service_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://:@redis:6379/0
      - AFROMESSAGE_BASEURL=https://api.afromessage.com/api
      - AFROMESSAGE_APIKEY=eyJhbGciOiJIUzI1NiJ9.eyJpZGVudGlmaWVyIjoiYk9uSVBBaVlzcllPVGswRDR1MmlDTktmMUplUHFoZmkiLCJleHAiOjE5MjAwMTg3NzksImlhdCI6MTc2MjI1MjM3OSwianRpIjoiZDY1NGM3MmItZmFjMS00ZjQ5LWE1MmUtMzY4NmZjZjRiZTBkIn0.Gx4_ihJZmGqbYQZyjRZq9e-XoBMgNRkvJr3L388UrBc
      - AFROMESSAGE_SENDER=AfroMessage
      - AFROMESSAGE_FROM=e80ad9d8-adf3-463f-80f4-7c4b39f7f164
      - ADMIN_API_KEY=admin-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - notification-network
    restart: unless-stopped

volumes:
  redisinsight-data:
  postgres-data:

networks:
  notification-network:
    driver: bridge
