


[tool.poetry]
name = "notification-service"
version = "0.1.0"
description = "Multi-tenant notification service"
authors = ["Mikiyas Shemsu Sani <mikiyasshemsu@gmail.com>"]
readme = "README.md"
packages = [{include = "notification_service", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.115.0,<0.121.0"
uvicorn = ">=0.38.0,<0.39.0"
sqlalchemy = ">=2.0.44,<3.0.0"
alembic = ">=1.17.0,<2.0.0"
python-dotenv = ">=1.2.1,<2.0.0"
pydantic = ">=2.10.3,<3.0.0"
asyncpg = ">=0.30.0,<0.31.0"
pydantic-settings = ">=2.11.0,<3.0.0"
psycopg2-binary = ">=2.9.11,<3.0.0"
aio-pika = {version = ">=9.5.7,<10.0.0", python = ">=3.10,<4.0"}
redis = {version = ">=5.0.0,<6.0.0", python = ">=3.10,<4.0"}
qena-shared-lib = "^0.1.18"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
