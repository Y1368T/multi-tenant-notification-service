#########

trigger:
  branches:
    include:
      - development  

pr:
  branches:
    include:
      - development

variables:
  - group: vg-aws-ecr

  # ECR repo name for THIS repo
  - name: ECR_REPO
    value: "multi-tenant-notification-api-dev-ecr"

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -euo pipefail

      echo "Docker version:"
      docker --version

      echo "Checking docker compose..."
      if docker compose version >/dev/null 2>&1; then
        docker compose version
      else
        echo "docker compose not found, installing compose plugin..."
        sudo apt-get update -y
        sudo apt-get install -y docker-compose-plugin
        docker compose version
      fi

      echo "Checking aws cli..."
      if aws --version >/dev/null 2>&1; then
        aws --version
      else
        echo "aws cli not found, installing..."
        sudo apt-get update -y
        sudo apt-get install -y awscli
        aws --version
      fi
    displayName: Ensure docker compose + awscli

  - bash: |
      set -euo pipefail

      export AWS_ACCESS_KEY_ID="$(AWS_ACCESS_KEY_ID)"
      export AWS_SECRET_ACCESS_KEY="$(AWS_SECRET_ACCESS_KEY)"
      export AWS_REGION="$(AWS_REGION)"

      ECR_REGISTRY="$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com"
      echo "ECR_REGISTRY=$ECR_REGISTRY"
      echo "##vso[task.setvariable variable=ECR_REGISTRY]$ECR_REGISTRY"

      echo "Login to ECR..."
      aws ecr get-login-password --region "$(AWS_REGION)" \
        | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    displayName: Login to AWS ECR

  - bash: |
      set -euo pipefail

      export AWS_ACCESS_KEY_ID="$(AWS_ACCESS_KEY_ID)"
      export AWS_SECRET_ACCESS_KEY="$(AWS_SECRET_ACCESS_KEY)"
      export AWS_REGION="$(AWS_REGION)"

      echo "Ensure ECR repo exists: $(ECR_REPO)"
      if aws ecr describe-repositories --repository-names "$(ECR_REPO)" --region "$(AWS_REGION)" >/dev/null 2>&1; then
        echo "ECR repo already exists."
      else
        echo "Creating ECR repo..."
        aws ecr create-repository --repository-name "$(ECR_REPO)" --region "$(AWS_REGION)" >/dev/null
      fi
    displayName: Ensure ECR repository exists

  - bash: |
      set -euo pipefail

      export ECR_REGISTRY="$(ECR_REGISTRY)"
      export ECR_REPO="$(ECR_REPO)"
      export IMAGE_TAG="latest"

      echo "Build & push: $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
      docker compose build
      docker compose push
    displayName: Build & Push latest

  - bash: |
      set -euo pipefail

      export AWS_ACCESS_KEY_ID="$(AWS_ACCESS_KEY_ID)"
      export AWS_SECRET_ACCESS_KEY="$(AWS_SECRET_ACCESS_KEY)"
      export AWS_REGION="$(AWS_REGION)"

      echo "Forcing new deployment..."
      echo "Cluster: $(ECS_CLUSTER)"
      echo "Service: $(ECS_SERVICE)"

      aws ecs update-service \
        --region "$(AWS_REGION)" \
        --cluster "$(ECS_CLUSTER)" \
        --service "$(ECS_SERVICE)" \
        --force-new-deployment

      echo "Waiting for service to become stable..."
      aws ecs wait services-stable \
        --region "$(AWS_REGION)" \
        --cluster "$(ECS_CLUSTER)" \
        --services "$(ECS_SERVICE)"

      echo "Deploy done ✅"
    displayName: Deploy to ECS (force new deployment)
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/development'))